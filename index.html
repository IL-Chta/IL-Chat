<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IL Talk V50 — Teste do Cérebro da Mioko</title>
<style>
body{font-family:Arial,sans-serif;background:#07111f;color:#eef6ff;margin:0;padding:24px}
main{max-width:820px;margin:auto}.box{background:#0d1b2d;border:1px solid #29415f;border-radius:18px;padding:22px}
h1{margin-top:0}textarea,input{box-sizing:border-box;width:100%;background:#07111f;color:white;border:1px solid #46698f;border-radius:10px;padding:12px}
textarea{min-height:90px}button{margin-top:10px;padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
#log{margin-top:18px;white-space:pre-wrap;background:#030914;border-radius:12px;padding:16px;min-height:180px}
.ok{color:#75f0a5}.bad{color:#ff8d8d}.muted{color:#9fb1c7;font-size:14px}
</style></head><body><main><div class="box">
<h1>🧠 IL Talk V50 — Teste do Cérebro da Mioko</h1>
<p>Sem avatar, sem voz, sem boca, sem bandeiras. Aqui só existe uma pergunta: <b>a IA está realmente respondendo?</b></p>
<label>Endpoint HTTPS da função <b>il-ai</b></label>
<input id="endpoint" placeholder="https://SEU-PROJETO.supabase.co/functions/v1/il-ai">
<label style="display:block;margin-top:14px">Pergunta</label>
<textarea id="q">Quanto é 1 + 1?</textarea>
<button id="send">Perguntar à Mioko</button>
<button id="clear">Limpar histórico</button>
<div id="log">Aguardando teste.</div>
<p class="muted">A V50 não inventa resposta e não usa fala do navegador. Se a conexão falhar, mostra o erro bruto.</p>
</div></main><script src="v50.js"></script></body></html>
